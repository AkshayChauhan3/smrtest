; ║  Board : ESP32-WROOM-32 Dev Module (or any ESP32 with CP2102/CH340 USB) ║
; ║  MCU   : Xtensa LX6 dual-core @ 240 MHz                                 ║
; ║  Flash  : 4 MB                                                           ║
; ║  RAM    : 520 KB SRAM                                                    ║
; ║                                                                          ║
