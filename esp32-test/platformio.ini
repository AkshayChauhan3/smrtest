[env:esp32dev]
; ── Platform / Board ──────────────────────────────────────────────────────────
platform  = espressif32
board     = esp32dev
framework = arduino

; ── Serial monitor ────────────────────────────────────────────────────────────
; Must match Serial.begin(115200) in main.cpp
monitor_speed = 115200

; ── Upload settings ───────────────────────────────────────────────────────────
; Increase if uploads are slow; decrease if failing (e.g. 115200 for noisy USB)
upload_speed = 921600

; ── Build flags ───────────────────────────────────────────────────────────────
; Enable verbose logging for debugging sensor reads (comment out in production)
; build_flags = -DCORE_DEBUG_LEVEL=5

; ── Libraries ─────────────────────────────────────────────────────────────────
; No external libraries required — only Arduino core.
; HC-SR04 is driven with raw GPIO + pulseIn().
